<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập / Đăng Ký - Việt Nam Du Lịch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Raleway:wght@300;400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth_style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <!-- HEADER -->
      <div class="auth-header">
        <div class="auth-logo">✦ Việt Nam</div>
        <div class="auth-title">Đặt Tour</div>
        <div class="auth-subtitle">Khám phá hành trình tuyệt vời của bạn</div>
      </div>

      <!-- TABS -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Đăng Nhập</button>
        <button class="auth-tab" data-tab="register">Đăng Ký</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="auth-form active" id="loginForm" data-form="login">
        <div class="form-message" id="loginMessage"></div>

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Mật Khẩu</label>
          <input type="password" id="loginPassword" name="password" placeholder="Nhập mật khẩu" required>
        </div>

        <div class="forgot-password">
          <a href="#forgot">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="auth-button">Đăng Nhập</button>

        <div class="auth-footer">
          Chưa có tài khoản? <a class="switch-tab" data-tab="register">Đăng ký ngay</a>
        </div>
      </form>

      <!-- REGISTER FORM -->
      <form class="auth-form" id="registerForm" data-form="register">
        <div class="form-message" id="registerMessage"></div>

        <div class="form-group">
          <label for="registerName">Họ và Tên</label>
          <input type="text" id="registerName" name="name" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" name="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="registerPhone">Số Điện Thoại</label>
          <input type="tel" id="registerPhone" name="phone" placeholder="0901234567" required>
        </div>

        <div class="form-group">
          <label for="registerPassword">Mật Khẩu</label>
          <input type="password" id="registerPassword" name="password" placeholder="Ít nhất 6 ký tự" required>
        </div>

        <div class="form-group">
          <label for="registerConfirm">Xác Nhận Mật Khẩu</label>
          <input type="password" id="registerConfirm" name="confirmPassword" placeholder="Nhập lại mật khẩu" required>
        </div>

        <div class="form-group-checkbox">
          <input type="checkbox" id="agreeTerms" name="terms" required>
          <label for="agreeTerms">Tôi đồng ý với <a href="#terms">điều khoản dịch vụ</a></label>
        </div>

        <button type="submit" class="auth-button">Đăng Ký</button>

        <div class="auth-footer">
          Đã có tài khoản? <a class="switch-tab" data-tab="login">Đăng nhập</a>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="auth_form.js"></script>
</body>
</html>
